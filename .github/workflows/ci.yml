name: Android Build (AutoPhone App)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── Build Release APK (Standalone App) ──────────────────────────────────────
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          # Disable cache to avoid phantom errors (similar to Forge OS strategy)
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        # Use same flags as Forge OS for consistency
        # -Pkotlin.incremental=false forces full non-incremental compile
        # --no-daemon avoids daemon state issues
        run: |
          set -o pipefail
          ./gradlew clean assembleRelease --no-daemon -Pkotlin.incremental=false -Dkotlin.compiler.execution.strategy=in-process 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-autophone-release
          path: build/outputs/apk/release/forge-autophone-release-unsigned.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  # ── Optional: Lint & Unit Tests ─────────────────────────────────────────────
  test:
    name: Lint + Unit Tests (optional)
    runs-on: ubuntu-latest
    # Run tests but don't block the build
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint --no-daemon || true

      - name: Run unit tests
        run: ./gradlew test --no-daemon || true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: '**/build/reports/lint-results*.html'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7
